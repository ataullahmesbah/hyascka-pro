<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="HYASCKA">
  <title>HYASCKA</title>
  <defs>
    <linearGradient id="hy-ramp" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0FD8F5"/>
      <stop offset="46%" stop-color="#2C7BF2"/>
      <stop offset="100%" stop-color="#7B45F0"/>
    </linearGradient>
    <linearGradient id="hy-left" x1="0" y1="0" x2="1" y2="1">
